[build]
  publish = "."

[[redirects]]
  from = "http://rapid-towing.com/*"
  to = "https://rapid-towing.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.rapid-towing.com/*"
  to = "https://rapid-towing.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

